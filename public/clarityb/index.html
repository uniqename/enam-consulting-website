<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Clarity Hub - Doxa & Co</title>
  <link rel="icon" type="image/svg+xml" href="/assets/images/doxa-icon.svg" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #f5f5f4; color: #1c1917; }
    #root { min-height: 100vh; }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="module">
    import React from 'https://esm.sh/react@18'
    import ReactDOM from 'https://esm.sh/react-dom@18/client'

    const ClarityHub = () => React.createElement('div', { style: { padding: '40px', textAlign: 'center' } },
      React.createElement('h1', null, 'Clarity Hub'),
      React.createElement('p', null, 'Business clarity assessment and strategy tools'),
      React.createElement('p', { style: { marginTop: '20px' } },
        React.createElement('a', { href: '/clarityb/admin', style: { marginRight: '20px', textDecoration: 'none', color: '#059669', fontWeight: 'bold' } }, 'Admin'),
        React.createElement('a', { href: '/clarityb/login', style: { textDecoration: 'none', color: '#059669', fontWeight: 'bold' } }, 'Login')
      )
    )

    ReactDOM.createRoot(document.getElementById('root')).render(React.createElement(ClarityHub))
  </script>
</body>
</html>
