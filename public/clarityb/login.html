<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Clarity Hub Login - Doxa & Co</title>
  <link rel="icon" type="image/svg+xml" href="/assets/images/doxa-icon.svg" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #f5f5f4; color: #1c1917; }
    .container { max-width: 400px; margin: 60px auto; padding: 40px; background: white; border-radius: 12px; box-shadow: 0 1px 4px rgba(0,0,0,0.08); }
    h1 { margin-bottom: 10px; font-size: 24px; }
    p { color: #78716c; margin-bottom: 30px; }
    form { display: flex; flex-direction: column; gap: 15px; }
    input { padding: 10px; border: 1px solid #e7e5e4; border-radius: 6px; font-size: 14px; }
    button { padding: 10px; background: #059669; color: white; border: none; border-radius: 6px; cursor: pointer; font-weight: 600; }
    button:hover { background: #047857; }
    .footer { margin-top: 20px; text-align: center; font-size: 14px; }
    a { color: #059669; text-decoration: none; }
  </style>
</head>
<body>
  <div class="container">
    <h1>Clarity Hub</h1>
    <p>Log in to your assessment account</p>
    <form onsubmit="event.preventDefault(); alert('Login coming soon!');">
      <input type="email" placeholder="Email address" required />
      <input type="password" placeholder="Password" required />
      <button type="submit">Sign In</button>
    </form>
    <div class="footer">
      <a href="/clarityb">← Back to Clarity Hub</a>
    </div>
  </div>
</body>
</html>
